    const actions=armed
      ? `<span class="tiny" style="color:#f0a9a9">削除しますか？</span><button class="btn sm danger" data-delok="${s.id}">確定</button><button class="btn sm ghost" id="delCancel">取消</button>`
      : `<button class="btn sm" data-loadslot="${s.id}">読込</button><button class="btn sm ghost danger" data-delslot="${s.id}">削除</button>`;
    return `<div class="slot-row"><div class="slot-info"><div class="slot-name">${s.name}</div><div class="tiny muted">${s.clubName} ・ ${phaseLabel(s.phase)} ・ S${s.seasonNo} 第${(s.round||0)+1}節 ・ ${fmt(s.ts)}</div></div><div class="slot-actions">${actions}</div></div>`;
  }).join("");
  const saveBar=canSave
    ? `<div class="slot-save"><input type="text" id="slotName" placeholder="${defaultSlotName()}" maxlength="40"><button class="btn gold" id="slotSaveNew">＋ 現在の状況を保存</button></div>`
    : `<p class="tiny muted" style="margin-bottom:12px">ゲーム開始後は、ここから現在の状況も新しいスロットに保存できます。</p>`;
  const empty=(!slots.length&&!auto)?`<p class="muted center" style="padding:22px">保存データはまだありません。</p>`:"";
  return `<div class="modal-backdrop" id="slotsBackdrop"></div>
   <div class="modal" role="dialog" aria-label="セーブ一覧">
     <div class="modal-h"><h3>セーブ一覧</h3><button class="x" id="slotsClose" aria-label="閉じる">✕</button></div>
     <div class="modal-b">${saveBar}${autoRow}${rows}${empty}
       <p class="tiny muted" style="margin-top:12px">ブラウザ内に保存されます（このページを直接開いた場合に有効）。端末をまたぐ保存・バックアップは「ファイルに保存」をご利用ください。</p>
     </div>
   </div>`;
}

</script>
<script>
/* ============================================================
   RENDER
============================================================ */
const app=()=>document.getElementById("app");
function h(html){const t=document.createElement("template");t.innerHTML=html.trim();return t.content.firstChild;}

function render(){
  if(!G){renderIntro();return;}
  if(G.view==="match"){renderMatch();return;}
  if(G.view==="seasonend"){renderShell(renderSeasonEnd());return;}
  let body="";
  switch(G.view){
    case "dashboard":body=renderDashboard();break;
    case "squad":body=renderSquad();break;
    case "tactics":body=renderTactics();break;
    case "transfers":body=renderTransfers();break;
    case "trade":body=renderTrade();break;
    case "table":body=renderTable();break;
    case "fixtures":body=renderFixtures();break;
    case "rankings":body=renderRankings();break;
    case "contracts":body=renderContracts();break;
    case "prophet":body=renderProphet();break;
    case "awards":body=renderAwards();break;
    case "draft":body=renderDraft();break;
    case "playoff":body=renderPlayoffHub();break;
    default:body=renderDashboard();
  }
  renderShell(body);
  bindCommon();
}

function renderShell(body){
  const club=G.clubs[G.user];
  const table=standings();
  const myPos=table.findIndex(c=>c.idx===G.user)+1;
  const navItems=[["dashboard","ダッシュボード"],["squad","スカッド"],["tactics","戦術"],["transfers","移籍市場"],["trade","トレード"],["contracts","契約"],["table","順位表"],["rankings","ランキング"],["awards","アワード"],["prophet","新聞"],["fixtures","日程"]];
  if(G.phase==="draft")navItems.push(["draft","ドラフト"]);
  else if(G.phase!=="regular")navItems.push(["playoff","プレーオフ"]);
  app().innerHTML=`
  <div class="topbar"><div class="topbar-in">
    <div class="crest">${crestSVG(G.user,42)}</div>
    <div class="club-meta">
      <span class="club-name">${club.name}</span>
      <span class="club-sub">${G.manager} 監督 ・ シーズン ${G.seasonNo}</span>
    </div>
    <div class="topbar-spacer"></div>
    <div class="stat-chip"><span class="k">順位</span><span class="v">${myPos}位</span></div>
    <div class="stat-chip"><span class="k">節</span><span class="v">${Math.min(G.round+1,G.schedule.length)}/${G.schedule.length}</span></div>
    <div class="stat-chip"><span class="k">予算</span><span class="v gold">${gold(G.budget)}</span></div>
  </div>
  <div class="nav">${navItems.map(([k,l])=>`<button data-view="${k}" class="${G.view===k?'active':''}">${l}</button>`).join("")}</div>
  </div>
  <div class="wrap" style="padding-top:18px">
    ${_flash?`<div class="card" style="border-color:var(--gold-soft);margin-bottom:14px"><div class="card-b" style="padding:12px 16px;color:var(--gold)">${_flash}</div></div>`:""}
    ${body}
  </div>`;
  bindCommon();
}
function bindCommon(){
  document.querySelectorAll(".nav button").forEach(b=>b.onclick=()=>{G.view=b.dataset.view;render();});
}

/* ---------- DASHBOARD ---------- */
function renderDashboard(){
  const club=G.clubs[G.user];
  const fx=currentFixtures();
  const me=fx&&fx.find(([h,a])=>h===G.user||a===G.user);
  let nextCard;
  if(G.round<G.schedule.length&&me){
    const isHome=me[0]===G.user;const opp=G.clubs[isHome?me[1]:me[0]];
    nextCard=`
    <div class="card">
      <div class="card-h"><h3>次の試合 ・ 第${G.round+1}節</h3><span class="tiny">${isHome?"ホーム":"アウェイ"}</span></div>
      <div class="card-b">
        <div class="scoreboard" style="padding:16px">
          <div class="sb-team"><div class="crest" style="margin:0 auto 6px">${crestSVG(club.idx,40)}</div><div class="nm">${club.name}</div></div>
          <div class="sb-mid"><div class="cz" style="font-size:20px;color:var(--gold)">VS</div></div>
          <div class="sb-team"><div class="crest" style="margin:0 auto 6px">${crestSVG(opp.idx,40)}</div><div class="nm">${opp.name}</div></div>
        </div>
        <div class="btn-row" style="margin-top:16px;justify-content:center">
          <button class="btn" data-view="tactics">戦術を確認</button>
          <button class="btn gold" id="play">試合へ ▶</button>
        </div>
      </div>
    </div>`;
  } else if(G.phase==="playoff"){
    nextCard=`<div class="card"><div class="card-h"><h3>プレーオフ進行中</h3></div><div class="card-b center">
      <p class="muted" style="margin-top:0">レギュラーシーズンは終了。トーナメントへ。</p>
      <button class="btn gold" data-view="playoff">プレーオフへ ▶</button></div></div>`;
  } else {
    nextCard=`<div class="card"><div class="card-b center muted">レギュラーシーズンは終了しました。</div></div>`;
  }
  // form: last results
  const myResults=[];
  for(let r=0;r<G.results.length;r++){const arr=G.results[r];if(!arr)continue;const m=arr.find(x=>x.h===G.user||x.a===G.user);if(m){const isH=m.h===G.user;const gf=isH?m.hs:m.as,ga=isH?m.as:m.hs;myResults.push(gf>ga?"win":gf<ga?"loss":"draw");}}
  const form=myResults.slice(-5).map(r=>`<span class="pill ${r}">${r==="win"?"勝":r==="loss"?"敗":"分"}</span>`).join(" ")||`<span class="tiny muted">まだ試合がありません</span>`;
  const tbl=standings();const myPos=tbl.findIndex(c=>c.idx===G.user)+1;const me2=tbl[myPos-1];

  return `
  <div class="grid cols-2">
    ${nextCard}
    <div class="card">
      <div class="card-h"><h3>クラブ概況</h3></div>
      <div class="card-b">
        <div style="display:flex;gap:18px;flex-wrap:wrap">
          <div><div class="eyebrow">順位</div><div style="font-size:26px;font-weight:800">${myPos}<span class="tiny muted"> / ${G.clubs.length}</span></div></div>
          <div><div class="eyebrow">勝点</div><div style="font-size:26px;font-weight:800">${me2.P}</div></div>
          <div><div class="eyebrow">戦績</div><div style="font-size:18px;font-weight:700;padding-top:6px">${me2.W}<span class="tiny muted">勝</span> ${me2.D}<span class="tiny muted">分</span> ${me2.L}<span class="tiny muted">敗</span></div></div>
        </div>
        <div class="divider"></div>
        <div class="eyebrow">直近フォーム</div>
        <div style="display:flex;gap:6px;margin-top:6px">${form}</div>
        <div class="divider"></div>
        <div class="eyebrow">サラリーキャップ</div>
        <div style="margin-top:7px">${capBar(club)}</div>
        <div class="divider"></div>
        <div class="eyebrow">今週のトレーニング</div>
        <div class="seg" style="margin-top:8px">${["attack","defense","speed","technique","fitness","balanced"].map(t=>`<button data-train="${t}" class="${G.training===t?'on':''}">${trainLabel(t)}</button>`).join("")}</div>
      </div>
    </div>
  </div>
  ${(G.offers&&G.offers.length)?`<div class="card" style="margin-top:16px;border-color:var(--gold)"><div class="card-h"><h3>📨 トレードオファー受信中</h3><span class="pill" style="color:var(--gold);border-color:var(--gold-soft)">${G.offers.length}件</span></div><div class="card-b"><p class="muted" style="margin-top:0">他クラブからトレードの打診が届いています。</p><button class="btn gold" data-view="trade">トレード画面で確認 ▶</button></div></div>`:""}
  <div class="card" style="margin-top:16px">
    <div class="card-h"><h3>クラブニュース</h3></div>
    <div class="card-b"><div class="news">${G.news.slice(0,8).map(n=>`<div class="news-item"><div class="news-ic">${n.ic}</div><div><div>${n.txt}</div></div></div>`).join("")}</div></div>
  </div>
  <div class="card" style="margin-top:16px">
    <div class="card-h"><h3>セーブ＆ロード</h3></div>
    <div class="card-b">
      <div class="btn-row">
        <button class="btn gold" id="saveFile">💾 ファイルに保存</button>
        <button class="btn" id="loadBtn">📁 ファイルから読込</button>
        <button class="btn" id="openSlots">📂 セーブ一覧</button>
        <button class="btn" id="quickSave">⚡ クイックセーブ</button>
        <button class="btn ghost" id="quickLoad">↩ クイックロード</button>
      </div>
      <input type="file" id="loadInput" accept=".json,application/json" style="display:none">
      <p class="tiny muted" style="margin-top:10px">「ファイルに保存」はJSONを書き出します（どの環境でも確実・バックアップや共有に最適）。「クイックセーブ」はブラウザ内に保存し、各節終了時に自動保存もされます（このページを直接ブラウザで開いた場合に有効）。</p>
    </div>
  </div>`;
}
function trainLabel(t){return {attack:"攻撃",defense:"守備",speed:"速さ",technique:"技術",fitness:"体力",balanced:"バランス"}[t];}

/* ---------- SQUAD ---------- */
function renderSquad(){
  const club=G.clubs[G.user];
  const groups=POS_ORDER.map(pos=>{
    const rows=club.squad.filter(p=>p.pos===pos).sort((a,b)=>overall(b)-overall(a)).map(p=>playerRow(p,true)).join("");
    return `<div class="card" style="margin-bottom:16px"><div class="card-h"><h3><span class="pos ${pos}">${POS[pos].short}</span>&nbsp; ${POS[pos].name}</h3><span class="tiny muted">${club.squad.filter(p=>p.pos===pos).length} 名</span></div>
      <div class="card-b" style="padding:0"><table><thead><tr><th>OVR</th><th>選手</th><th class="center">年齢</th><th class="center">体力</th><th class="num">評価額</th><th></th></tr></thead><tbody>${rows}</tbody></table></div></div>`;
  }).join("");
  return `<p class="eyebrow">スカッド管理</p><p class="tiny muted" style="margin-top:-4px">選手を選ぶと詳細ステータスを表示。放出すると評価額の40%が予算に入ります。</p>${groups}${detailPanel()}`;
}
let _detailId=null;
function detailPanel(){
  if(_detailId==null)return "";
  const club=G.clubs[G.user];const p=getP(club,_detailId);if(!p)return"";
  const bars=["att","def","spd","tec","sta","men"].map(k=>{
    const v=p[k];const c=v>=80?"var(--gold)":v>=70?"var(--aqua)":v>=60?"var(--blue)":"var(--muted2)";
    return `<div class="statbar"><span class="lbl">${STAT_LABELS[k]}</span><div class="track"><div class="fill" style="width:${v}%;background:${c}"></div></div><span class="val">${v}</span></div>`;
  }).join("");
  const o=overall(p);
  return `<div class="card" style="margin-top:4px;border-color:var(--gold-soft)"><div class="card-h"><h3>${flag(p.nat)} ${p.name} ${p.star?'<span class="gold">★</span>':''}</h3><button class="btn sm ghost" id="closeDetail">閉じる</button></div>
   <div class="card-b"><div class="grid cols-2">
    <div>
      <div style="display:flex;gap:14px;align-items:center;margin-bottom:12px">
        <span class="ava">${avatarSVG(p,64,clubColors(G.user))}</span>
        <div class="ovr ${ovrTier(o)}" style="width:48px;height:48px;font-size:20px">${o}</div>
        <div><div><span class="pos ${p.pos}">${POS[p.pos].short}</span> ${POS[p.pos].name}</div>
        <div class="tiny muted">${flag(p.nat)} ${p.nat} ・ ${p.age}歳 ・ ポテンシャル ${p.potential} ・ ${gold(p.value)}</div></div>
      </div>
      ${bars}
    </div>
    <div>
      <div class="eyebrow">コンディション</div>
      <div class="statbar"><span class="lbl">体力</span><div class="track"><div class="fill" style="width:${p.fitness}%;background:var(--aqua)"></div></div><span class="val">${p.fitness}</span></div>
      ${p.inj>0?`<div class="pill loss" style="margin-top:8px">負傷 ${p.inj}節</div>`:`<div class="pill win" style="margin-top:8px">出場可</div>`}
      <div class="divider"></div>
      <button class="btn danger" data-release="${p.id}">契約を解除して放出</button>
    </div>
   </div></div></div>`;
}
function playerRow(p,actions){
  const o=overall(p);
  return `<tr data-detail="${p.id}" style="cursor:pointer">
    <td><span class="ovr ${ovrTier(o)}">${o}</span></td>
    <td><div style="display:flex;align-items:center;gap:9px">
      <span class="ava">${avatarSVG(p,34,clubColors(G.user))}</span>
      <div><div class="player-name">${p.name} ${p.star?'<span class="gold" title="主力">★</span>':''} ${p.inj>0?'<span class="pill loss" style="margin-left:4px">負傷</span>':''}</div>
      <div class="tiny">${POS[p.pos].name} ・ ${flag(p.nat)} ${p.nat}</div></div>
    </div></td>
    <td class="center">${p.age}</td>
    <td class="center"><span class="${p.fitness>=80?'aqua':p.fitness>=55?'':'quaffle'}">${p.fitness}</span></td>
    <td class="num">${gold(p.value)}</td>
    <td class="num">${actions?`<button class="btn sm ghost" data-detail="${p.id}">詳細</button>`:""}</td>
  </tr>`;
}

/* ---------- TACTICS ---------- */
function renderTactics(){
  const club=G.clubs[G.user];
  if(!lineupValid(G.lineup))autoLineup(club);
  const lu=G.lineup;
  const selFor=(pos,slot)=>{
    const chosen=new Set([...lu.CH,...lu.BE,...lu.KE,...lu.SE]);
    const cur=lu[pos][slot];
    const opts=club.squad.filter(p=>p.pos===pos).map(p=>{
      const taken=chosen.has(p.id)&&p.id!==cur;
      return `<option value="${p.id}" ${p.id===cur?"selected":""} ${taken?"disabled":""}>${p.name}（${overall(p)}）${p.inj>0?" ⚠負傷":""}</option>`;
    }).join("");
    return `<select data-pos="${pos}" data-slot="${slot}"><option value="">— 未選択 —</option>${opts}</select>`;
  };
  const slotBlock=(pos)=>{
    let rows="";
    for(let s=0;s<POS[pos].count;s++)rows+=`<label class="fld"><span class="l"><span class="pos ${pos}">${POS[pos].short}</span> ${POS[pos].name} ${POS[pos].count>1?s+1:""}</span>${selFor(pos,s)}</label>`;
    return rows;
  };
  const r=ratings(club,lu);
  const T=tac(club);
  return `
  <p class="eyebrow">戦術・フォーメーション</p>
  <div class="grid cols-2">
    <div class="card"><div class="card-h"><h3>ピッチ配置</h3><span class="tiny muted">7人制</span></div>
      <div class="card-b">
        ${pitchView(club,lu)}
        <div class="legend" style="margin-top:12px">
          <span><i style="background:#e08d80"></i>CH</span><span><i style="background:#86b0e0"></i>BE</span><span><i style="background:#74cdbd"></i>KE</span><span><i style="background:var(--gold)"></i>SE</span>
        </div>
      </div>
    </div>
    <div class="card"><div class="card-h"><h3>ラインナップ</h3><button class="btn sm" id="autoLu">自動編成</button></div>
      <div class="card-b">${POS_ORDER.map(slotBlock).join("")}</div>
    </div>
  </div>
  <div class="grid cols-2" style="margin-top:16px">
    <div class="card"><div class="card-h"><h3>チームの方針</h3></div><div class="card-b">
      <div class="eyebrow">スタイル</div>
      <div class="seg" style="margin:6px 0 16px">${Object.keys(STYLE).map(k=>`<button data-style="${k}" class="${T.style===k?'on':''}">${STYLE[k].label}</button>`).join("")}</div>
      <div class="eyebrow">隊形 (チェイサーの配置)</div>
      <div class="seg" style="margin:6px 0 16px">${Object.keys(FORMATION).map(k=>`<button data-formation="${k}" class="${T.formation===k?'on':''}">${FORMATION[k].label}</button>`).join("")}</div>
      <div class="eyebrow">テンポ</div>
      <div class="seg" style="margin:6px 0 16px">${Object.keys(TEMPO).map(k=>`<button data-tempo="${k}" class="${T.tempo===k?'on':''}">${TEMPO[k].label}</button>`).join("")}</div>
      <div class="eyebrow">プレッシング</div>
      <div class="seg" style="margin:6px 0 16px">${Object.keys(PRESS).map(k=>`<button data-press="${k}" class="${T.press===k?'on':''}">${PRESS[k].label}</button>`).join("")}</div>
      <div class="eyebrow">ブラッジャー戦術</div>
      <div class="seg" style="margin:6px 0 16px">${Object.keys(BEATER).map(k=>`<button data-beater="${k}" class="${T.beater===k?'on':''}">${BEATER[k].label}</button>`).join("")}</div>
      <div class="eyebrow">シーカーの役割</div>
      <div class="seg" style="margin-top:6px">${Object.keys(SEEKROLE).map(k=>`<button data-seeker="${k}" class="${T.seeker===k?'on':''}">${SEEKROLE[k].label}</button>`).join("")}</div>
    </div></div>
    <div class="card"><div class="card-h"><h3>チーム評価値</h3></div><div class="card-b">
      ${ratingBar("攻撃力",r.atk,140)}
      ${ratingBar("守備力",r.def,120)}
      ${ratingBar("シーカー",r.seek,99)}
      <p class="tiny muted" style="margin-top:14px;line-height:1.7">
        <b>隊形</b>：チェイサーを攻撃/守備へ配分。<br>
        <b>テンポ</b>：高速ほど得点機会が増えるが終盤に消耗。<br>
        <b>プレッシング</b>：相手の攻撃を抑えるが体力を削る。<br>
        <b>ブラッジャー</b>：攻撃支援は相手の攻撃を寸断しやすく、守備固めは失点を抑える。<br>
        <b>シーカー</b>：「探索重視」は自軍の捕獲を優先、「マーク」は相手シーカーを抑えて捕獲を妨害（自軍はやや不利に）。<br>
        <span class="muted">※スニッチは常に「勝てる状況」でのみ狙います（当然の判断として自動）。</span>
      </p>
      <p class="tiny muted" style="margin-top:8px">評価値は隊形・スタイル・ブラッジャー戦術とラインナップを反映します（テンポ／プレスは試合中に作用）。</p>
    </div></div>
  </div>`;
}
function ratingBar(label,v,max){
  const pct=clamp(v/max*100,4,100);const c=pct>=75?"var(--gold)":pct>=55?"var(--aqua)":"var(--blue)";
  return `<div class="statbar" style="margin:8px 0"><span class="lbl" style="width:60px">${label}</span><div class="track" style="height:9px"><div class="fill" style="width:${pct}%;background:${c}"></div></div><span class="val" style="width:34px">${Math.round(v)}</span></div>`;
}
function pitchView(club,lu){
  const players=[];
  const positions={
    CH:[[28,28],[50,20],[72,28]],
    BE:[[34,52],[66,52]],
    KE:[[50,84]],
    SE:[[50,58]],
  };
  let html=`<div class="pitch">
    <div class="hoop" style="left:42%;top:6%"></div><div class="hoop" style="left:50%;top:4%"></div><div class="hoop" style="left:58%;top:6%"></div>`;
  for(const pos of POS_ORDER){
    lu[pos].forEach((id,i)=>{
      const p=getP(club,id);if(!p)return;
      const [x,y]=positions[pos][i]||[50,50];
      const last=p.name.split(" ").slice(-1)[0];
      html+=`<div class="token" style="left:${x}%;top:${y}%"><span class="tok-ava">${avatarSVG(p,40,clubColors(club.idx))}</span><div class="nm">${last} <span class="tok-ovr ${pos}">${overall(p)}</span></div></div>`;
    });
  }
  html+=`</div>`;
  return html;
}

/* ---------- TRANSFERS ---------- */
function renderTransfers(){
  const rows=G.market.sort((a,b)=>overall(b)-overall(a)).map(p=>{
    const o=overall(p);const afford=p.value<=G.budget;
    return `<tr>
      <td><span class="ovr ${ovrTier(o)}">${o}</span></td>

/* ---------- salary cap bar ---------- */
function capBar(club){
  const pay=payroll(club), pct=clamp(Math.round(pay/SALARY_CAP*100),0,100), over=pay>SALARY_CAP;
  return `<div class="capbar"><div class="capbar-row"><span class="tiny muted">サラリー</span><span class="tiny ${over?'quaffle':'muted'}">${gold(pay)} / ${gold(SALARY_CAP)}</span></div>
    <div class="capbar-track"><div class="capbar-fill ${over?'over':pct>88?'tight':''}" style="width:${pct}%"></div></div>
    <div class="tiny ${over?'quaffle':'aqua'}" style="margin-top:3px">${over?`キャップ超過 ${gold(pay-SALARY_CAP)}`:`残り枠 ${gold(SALARY_CAP-pay)}`}</div></div>`;
}

/* ---------- TRADE ---------- */
function renderTrade(){
  if(!G.trade)G.trade={partner:null,give:[],get:[],cash:0};
  if(!G.offers)G.offers=[];
  const me=G.clubs[G.user];
  const tr=G.trade;
  const partners=G.clubs.filter(c=>c.idx!==G.user);
  // incoming offers
  let offersHTML="";
  if(G.offers.length){
    offersHTML=`<div class="card" style="margin-bottom:16px;border-color:var(--gold)"><div class="card-h"><h3>受信トレードオファー</h3><span class="pill" style="color:var(--gold);border-color:var(--gold-soft)">${G.offers.length}</span></div>
      <div class="card-b">${G.offers.map(o=>{
        const partner=G.clubs[o.pi], give=getP(partner,o.giveId), want=getP(me,o.wantId);
        if(!give||!want)return "";
        return `<div class="offer">
          <div class="offer-side"><div class="tiny muted">獲得</div>${miniPlayer(give,o.pi)}${o.cash?`<div class="tiny aqua">＋${gold(o.cash)}</div>`:""}</div>
          <div class="offer-arrow">⇄</div>
          <div class="offer-side"><div class="tiny muted">放出</div>${miniPlayer(want,G.user)}</div>
          <div class="offer-actions"><button class="btn sm gold" data-acceptoffer="${o.id}">受諾</button><button class="btn sm ghost" data-declineoffer="${o.id}">辞退</button></div>
        </div>`;}).join("")}</div></div>`;
  }
  // partner picker
  const picker=`<div class="seg" style="flex-wrap:wrap;margin-bottom:12px">${partners.map(c=>`<button data-tpartner="${c.idx}" class="${tr.partner===c.idx?'on':''}">${c.name}</button>`).join("")}</div>`;
  if(tr.partner==null){
    return `<p class="eyebrow">トレード</p>${offersHTML}
      <div class="card"><div class="card-b">${capBar(me)}</div></div>
      <p class="muted" style="margin:14px 0 8px">トレード相手のクラブを選択してください。</p>${picker}`;
  }
  const partner=G.clubs[tr.partner];
  const giveP=tr.give.map(id=>getP(me,id)).filter(Boolean);
  const getP_=tr.get.map(id=>getP(partner,id)).filter(Boolean);
  const giveVal=sumValue(tr.give,me)+tr.cash, getVal=sumValue(tr.get,partner);
  const myAfter=payroll(me)-sumSalary(tr.give,me)+sumSalary(tr.get,partner);
  const paAfter=payroll(partner)-sumSalary(tr.get,partner)+sumSalary(tr.give,me);
  const prob=tradeAcceptProb(tr.partner,tr.give,tr.get,tr.cash);
  const reasons=tradeReasons(tr.partner,tr.give,tr.get,tr.cash);
  const canSend=(tr.give.length||tr.cash)&&tr.get.length&&reasons.length===0;
  const list=(club,squad,sel,attr)=>squad.slice().sort((a,b)=>overall(b)-overall(a)).map(p=>{
    const on=sel.includes(p.id);
    return `<button class="trade-pick ${on?'on':''}" data-${attr}="${p.id}">
      <span class="ava">${avatarSVG(p,30,clubColors(club.idx))}</span>
      <span class="tp-main"><span class="tp-name">${p.name} ${p.star?'<span class="gold">★</span>':''}</span>
      <span class="tiny muted"><span class="pos ${p.pos}">${POS[p.pos].short}</span> OVR${overall(p)} ・ 年俸${gold(p.salary||0)} ・ 残${p.years||1}年</span></span>
      <span class="ovr ${ovrTier(overall(p))}">${overall(p)}</span></button>`;
  }).join("");
  const probColor=prob>=66?'aqua':prob>=33?'gold':'quaffle';
  return `<p class="eyebrow">トレード</p>${offersHTML}
   ${picker}
   <div class="grid cols-2" style="gap:14px">
     <div class="card"><div class="card-h"><h3>放出（${me.name}）</h3></div><div class="card-b" style="padding:8px"><div class="trade-list">${list(me,me.squad,tr.give,"tgive")}</div></div></div>
     <div class="card"><div class="card-h"><h3>獲得（${partner.name}）</h3></div><div class="card-b" style="padding:8px"><div class="trade-list">${list(partner,partner.squad,tr.get,"tget")}</div></div></div>
   </div>
   <div class="card" style="margin-top:14px"><div class="card-b">
     <div class="grid cols-2" style="gap:14px">
       <div><div class="eyebrow">あなたのキャップ（取引後）</div>${capBarAfter(me,myAfter)}</div>
       <div><div class="eyebrow">${partner.name}（取引後）</div>${capBarAfter(partner,paAfter)}</div>
     </div>
     <div class="trade-cash"><span class="tiny muted">上乗せキャッシュ（あなた負担・予算 ${gold(G.budget)}）</span>
       <div class="cash-row"><button class="btn sm" data-tcash="-2000">−2000</button><button class="btn sm" data-tcash="-500">−500</button>
        <span class="cash-val gold">${gold(tr.cash)}</span>
        <button class="btn sm" data-tcash="500">＋500</button><button class="btn sm" data-tcash="2000">＋2000</button>
        <button class="btn sm ghost" data-tcash="reset">0</button></div></div>
     <div class="trade-summary">
       <div><div class="tiny muted">提示価値（相手が受取）</div><div style="font-weight:800">${gold(giveVal)}</div></div>
       <div><div class="tiny muted">要求価値（相手が放出）</div><div style="font-weight:800">${gold(getVal)}</div></div>
       <div><div class="tiny muted">成立確率</div><div class="${probColor}" style="font-weight:900;font-size:22px">${prob}%</div></div>
     </div>
     ${reasons.length?`<div class="trade-warn">${reasons.map(r=>`・${r}`).join("<br>")}</div>`:""}
     <button class="btn gold" id="sendTrade" style="width:100%;margin-top:6px" ${canSend?"":"disabled"}>オファーを送信</button>
   </div></div>
   <p class="tiny muted" style="margin-top:10px">成立確率は、相手にとっての価値収支・チーム事情・サラリーキャップ・主力流出への抵抗から算出されます。送信すると確率に応じて成立／拒否が判定されます。</p>`;
}
function capBarAfter(club,after){
  const pct=clamp(Math.round(after/SALARY_CAP*100),0,100), over=after>SALARY_CAP;
  return `<div class="capbar-track"><div class="capbar-fill ${over?'over':pct>88?'tight':''}" style="width:${pct}%"></div></div>
    <div class="tiny ${over?'quaffle':'muted'}" style="margin-top:3px">${gold(after)} / ${gold(SALARY_CAP)} ${over?`（超過 ${gold(after-SALARY_CAP)}）`:""}</div>`;

function miniPlayer(p,ci){

/* ---------- RANKINGS (league-wide leaders) ---------- */
const RANK_METRICS=[["ovr","総合"],["att","攻撃"],["def","守備"],["spd","速さ"],["tec","技術"],["sta","体力"],["men","精神"],["potential","ポテンシャル"]];
const RANK_CATS=[["attr","能力値"],["prospect","若手有望株"],["scorer","得点王"],["catcher","スニッチ捕獲"]];
function rkPlayerCell(p,ci){

function renderRankings(){
  G.rankCat=G.rankCat||"attr";
  G.rankPos=G.rankPos||"CH";
  G.rankMetric=G.rankMetric||"ovr";
  const cat=G.rankCat;
  const posTabs=[["CH","チェイサー"],["BE","ビーター"],["KE","キーパー"],["SE","シーカー"],["ALL","全ポジション"]];
  let pool=[];G.clubs.forEach(c=>c.squad.forEach(p=>pool.push({p,ci:c.idx})));

  let list, head, rowFn, note, subControls="";
  const rankCell=(i)=>`<td class="center ${i<3?'rk'+(i+1):''}" style="font-weight:700">${i+1}</td>`;

  if(cat==="attr"){
    subControls=`<div class="seg" style="margin-bottom:9px;flex-wrap:wrap">${posTabs.map(([k,l])=>`<button data-rankpos="${k}" class="${G.rankPos===k?'on':''}">${l}</button>`).join("")}</div>
      <div class="seg" style="margin-bottom:14px;flex-wrap:wrap">${RANK_METRICS.map(([k,l])=>`<button data-rankmetric="${k}" class="${G.rankMetric===k?'on':''}">${l}</button>`).join("")}</div>`;
    const val=p=>G.rankMetric==="ovr"?overall(p):(G.rankMetric==="potential"?p.potential:p[G.rankMetric]);
    list=pool.filter(it=>G.rankPos==="ALL"||it.p.pos===G.rankPos).sort((a,b)=>val(b.p)-val(a.p)||overall(b.p)-overall(a.p)).slice(0,25);
    const showM=G.rankMetric!=="ovr", ml=RANK_METRICS.find(m=>m[0]===G.rankMetric)[1];
    head=`<th class="center">#</th><th>選手</th><th>クラブ</th><th class="num">OVR</th>${showM?`<th class="num">${ml}</th>`:""}`;
    rowFn=(it,i)=>{const p=it.p,o=overall(p);return `<tr class="${it.ci===G.user?'tbl-row-me':''}">${rankCell(i)}${rkPlayerCell(p,it.ci)}<td class="num"><span class="ovr ${ovrTier(o)}">${o}</span></td>${showM?`<td class="num gold" style="font-weight:800;font-size:15px">${val(p)}</td>`:""}</tr>`;};
    note=`全${G.clubs.length}クラブの${G.rankPos==="ALL"?"全ポジション":POS[G.rankPos].name}を${G.rankMetric==="ovr"?"総合値(OVR)":ml}順に上位25名。`;
  }
  else if(cat==="prospect"){
    subControls=`<div class="seg" style="margin-bottom:14px;flex-wrap:wrap">${posTabs.map(([k,l])=>`<button data-rankpos="${k}" class="${G.rankPos===k?'on':''}">${l}</button>`).join("")}</div>`;
    list=pool.filter(it=>it.p.age<=23&&(G.rankPos==="ALL"||it.p.pos===G.rankPos)).sort((a,b)=>b.p.potential-a.p.potential||overall(b.p)-overall(a.p)).slice(0,25);
    head=`<th class="center">#</th><th>選手</th><th>クラブ</th><th class="num">OVR</th><th class="num">POT</th><th class="num">伸び代</th>`;
    rowFn=(it,i)=>{const p=it.p,o=overall(p),up=p.potential-o;return `<tr class="${it.ci===G.user?'tbl-row-me':''}">${rankCell(i)}${rkPlayerCell(p,it.ci)}<td class="num"><span class="ovr ${ovrTier(o)}">${o}</span></td><td class="num gold" style="font-weight:800;font-size:15px">${p.potential}</td><td class="num ${up>0?'aqua':'muted'}">${up>0?'+'+up:up}</td></tr>`;};
    note=`23歳以下の選手を、将来のポテンシャル(POT)順に上位25名。「伸び代」=POT−現在OVR。`;
  }
  else if(cat==="scorer"){
    list=pool.filter(it=>it.p.season&&it.p.season.goals>0).sort((a,b)=>b.p.season.goals-a.p.season.goals||b.p.season.gp-a.p.season.gp).slice(0,25);
    head=`<th class="center">#</th><th>選手</th><th>クラブ</th><th class="num">試合</th><th class="num">ゴール</th>`;
    rowFn=(it,i)=>{const p=it.p;return `<tr class="${it.ci===G.user?'tbl-row-me':''}">${rankCell(i)}${rkPlayerCell(p,it.ci)}<td class="num muted">${p.season.gp}</td><td class="num gold" style="font-weight:800;font-size:16px">${p.season.goals}</td></tr>`;};
    note=`今シーズンのクアッフル得点数（1ゴール=10点）の上位。チェイサーが中心です。`;
  }
  else { // catcher
    list=pool.filter(it=>it.p.season&&it.p.season.catches>0).sort((a,b)=>b.p.season.catches-a.p.season.catches||b.p.season.gp-a.p.season.gp).slice(0,25);
    head=`<th class="center">#</th><th>選手</th><th>クラブ</th><th class="num">試合</th><th class="num">捕獲</th>`;
    rowFn=(it,i)=>{const p=it.p;return `<tr class="${it.ci===G.user?'tbl-row-me':''}">${rankCell(i)}${rkPlayerCell(p,it.ci)}<td class="num muted">${p.season.gp}</td><td class="num gold" style="font-weight:800;font-size:16px">${p.season.catches}</td></tr>`;};
    note=`今シーズンのスニッチ捕獲数の上位。シーカーの活躍指標です。`;
  }

  const body=list.length
    ? `<div class="card"><div class="card-b" style="padding:0;overflow-x:auto"><table><thead><tr>${head}</tr></thead><tbody>${list.map(rowFn).join("")}</tbody></table></div></div>`
    : `<div class="card"><div class="card-b center muted" style="padding:28px">まだデータがありません。試合を進めると集計されます。</div></div>`;
  return `<p class="eyebrow">選手ランキング</p>
   <div class="seg" style="margin-bottom:12px;flex-wrap:wrap">${RANK_CATS.map(([k,l])=>`<button data-rankcat="${k}" class="${cat===k?'on':''}">${l}</button>`).join("")}</div>
   ${subControls}
   ${body}
   <p class="tiny muted" style="margin-top:10px">${note} 自分のクラブの選手は金色でハイライトされます。</p>`;
}

function renderPlayoffHub(){

      <div style="font-size:17px;margin:6px 0 12px">第 ${g} 戦${s.wa===1&&s.wb===1?'（最終戦）':''}</div>

        <button class="btn" data-view="tactics">戦術を調整</button>
        <button class="btn gold" id="poPlay">試合へ ▶</button>
      </div></div></div>`;
  }
  const cols=stages.map(([k,lbl])=>{
    const ties=(po.results[k]&&po.results[k].length)?po.results[k]:(k===po.stage?po.ties:[]);
    const inner=ties.length?ties.map(tieCard).join(''):`<div class="tiny muted">未確定</div>`;
    return `<div class="card po-col"><div class="card-h"><h3>${lbl}</h3></div><div class="card-b">${inner}</div></div>`;
  }).join('');
  let champ='';

      <div style="font-size:34px">👑</div><div class="crest" style="width:40px;height:44px;margin:6px auto">${crestSVG(po.championIdx,40)}</div>

/* ---- 年間アワード ---- */
function prodOff(p){return overall(p)+(p.season?p.season.goals*0.6+p.season.catches*7:0);}
function prodDef(p){return overall(p)+(p.season?p.season.gp*0.4:0);}
function mvpScore(p,rb){return overall(p)+(p.season?p.season.goals*0.5+p.season.catches*6:0)+(rb||0);}
function bestBy(pool,score,n){return pool.slice().sort((x,y)=>score(y.p)-score(x.p)).slice(0,n);}
function computeFinalsMvp(champIdx){
  const champ=G.clubs[champIdx];if(!champ)return null;
  const fs=(G.po&&G.po.finalStats)||{};
  let best=null,bestScore=-1;
  champ.squad.forEach(p=>{const s=fs[p.id];const sc=(s?(s.goals*0.6+s.catches*8+s.gp*0.5):0)+overall(p)*0.1;if(sc>bestScore){bestScore=sc;best=p;}});
  if(!best)return null;const s=fs[best.id]||{goals:0,catches:0,gp:0};
  return {id:best.id,name:best.name,pos:best.pos,ovr:overall(best),club:champIdx,nat:best.nat,goals:s.goals,catches:s.catches};
}
function computeAwards(){
  const tbl=standings();const rankOf={};tbl.forEach((c,i)=>rankOf[c.idx]=i);
  const pool=allPlayers().filter(x=>x.p.season&&x.p.season.gp>0);
  if(!pool.length)return null;
  const rb=x=>Math.max(0,(G.clubs.length-rankOf[x.club.idx])*0.8);
  const lite=x=>x?{id:x.p.id,name:x.p.name,pos:x.p.pos,ovr:overall(x.p),club:x.club.idx,nat:x.p.nat,goals:x.p.season.goals,catches:x.p.season.catches,gp:x.p.season.gp}:null;
  const mvp=pool.slice().sort((a,b)=>mvpScore(b.p,rb(b))-mvpScore(a.p,rb(a)))[0];
  const byPos=pos=>pool.filter(x=>x.p.pos===pos);
  const firstTeam={CH:bestBy(byPos("CH"),prodOff,3).map(lite),BE:bestBy(byPos("BE"),prodDef,2).map(lite),KE:bestBy(byPos("KE"),prodDef,1).map(lite),SE:bestBy(byPos("SE"),prodOff,1).map(lite)};
  const offense=pool.filter(x=>x.p.pos==="CH"||x.p.pos==="SE").sort((a,b)=>prodOff(b.p)-prodOff(a.p))[0];
  const defense=pool.filter(x=>x.p.pos==="KE"||x.p.pos==="BE").sort((a,b)=>prodDef(b.p)-prodDef(a.p))[0];
  const champIdx=(G.po&&G.po.championIdx!=null)?G.po.championIdx:tbl[0].idx;
  return {seasonNo:G.seasonNo,champIdx,mvp:lite(mvp),offense:lite(offense),defense:lite(defense),finalsMvp:computeFinalsMvp(champIdx),firstTeam};
}
function awChip(x){
  if(!x)return '<span class="tiny muted">該当なし</span>';
  return `<div style="display:flex;align-items:center;gap:9px"><span class="ovr ${ovrTier(x.ovr)}">${x.ovr}</span>
    <div><div class="player-name">${flag(x.nat)} ${x.name}</div>
    <div class="tiny muted">${POS[x.pos].name} ・ ${G.clubs[x.club]?G.clubs[x.club].name:''}${x.goals!=null&&(x.pos==='CH'||x.pos==='SE')?` ・ ${x.goals}G`:''}${x.catches?` ・ 捕獲${x.catches}`:''}</div></div></div>`;
}

}

function generateProphet(){
  const wk=G.round+1;const res=G.results[G.round]||[];
  const tbl=standings();const leader=tbl[0];
  let big=null;res.forEach(m=>{const d=Math.abs(m.hs-m.as);if(!big||d>big.d)big=Object.assign({},m,{d});});
  const pool=allPlayers().filter(x=>x.p.season&&x.p.season.gp>0);
  const topG=pool.slice().sort((a,b)=>b.p.season.goals-a.p.season.goals)[0];
  const items=[];
  if(big){const hn=G.clubs[big.h].name,an=G.clubs[big.a].name;const wn=big.hs>big.as?hn:an;items.push(`${wn} が ${Math.max(big.hs,big.as)}–${Math.min(big.hs,big.as)} で快勝。観客を沸かせた。`);}
  items.push(`首位は ${leader.name}（勝点${leader.P}）。${tbl[1]?`2位 ${tbl[1].name} が勝点${Math.max(0,leader.P-tbl[1].P)}差で追走。`:''}`);
  if(topG&&topG.p.season.goals>0)items.push(`得点ランクは ${topG.p.name}（${topG.club.name}）が ${topG.p.season.goals} ゴールで先頭。`);
  const inj=G.clubs[G.user].squad.find(p=>p.inj>0);
  if(inj)items.push(`負傷情報: あなたのクラブの ${inj.name} は${inj.injType?inj.injType+'で':''}あと ${inj.inj} 節の離脱見込み。`);
  else items.push(pick(["移籍市場では各クラブが補強に動くとの噂。","ファンは週末の好カードに期待を寄せている。","解説者は上位陣の戦術的成熟を高く評価した。"]));
  const headline=pick([`第${wk}節 詳報`,`クィディッチ・ウィークリー 第${wk}節`,`今節のハイライト`,`スタンドの熱狂 ── 第${wk}節`]);
  G.prophet=G.prophet||[];
  G.prophet.unshift({wk,season:G.seasonNo,headline,items});
  if(G.prophet.length>40)G.prophet.pop();
}

/* ---- 新人ドラフト ---- */
const DRAFT_ROUNDS=2;
function makeProspect(){
  const pos=pick(POS_ORDER);
  const p=makePlayer(pos,ri(50,64));
  p.age=ri(17,20);
  trimToOVR(p,ri(58,70));
  const o=overall(p);
  p.potential=clamp(o+ri(8,22),o+6,99);
  p.star=false;p.years=3;
  p.value=playerValue(p);p.salary=Math.round(contractSalary(p)*0.7/100)*100;
  return p;
}
function startDraft(){
  const order=standings().map(c=>c.idx).reverse(); // 最下位から
  const seq=[];
  for(let r=0;r<DRAFT_ROUNDS;r++){const ord=(r%2===0)?order:order.slice().reverse();ord.forEach(i=>seq.push(i));} // スネーク
  const pool=[];const n=seq.length+6;for(let i=0;i<n;i++)pool.push(makeProspect());
  pool.sort((a,b)=>b.potential-a.potential);
  G.draft={order:seq,pick:0,pool,log:[],rounds:DRAFT_ROUNDS};
  G.phase='draft';G.view='draft';
  pushNews('🎓',`新人ドラフト開催（全${DRAFT_ROUNDS}巡 ・ ${seq.length}指名）。指名順は下位クラブ優先。`);
  advanceDraft();
}
function draftRoundNo(){return Math.floor(G.draft.pick/G.clubs.length)+1;}
function teamNeedScore(club,p){const cnt=club.squad.filter(x=>x.pos===p.pos).length;const need=Math.max(0,(POS[p.pos].count+1)-cnt);return p.potential+need*4;}
function advanceDraft(){
  const d=G.draft;
  while(d.pick<d.order.length){
    const idx=d.order[d.pick];
    if(idx===G.user){render();return;}
    let best=0,bs=-1;d.pool.forEach((p,i)=>{const s=teamNeedScore(G.clubs[idx],p);if(s>bs){bs=s;best=i;}});
    const p=d.pool.splice(best,1)[0];const rnd=draftRoundNo();
    G.clubs[idx].squad.push(p);d.log.push({club:idx,id:p.id,round:rnd});
    d.pick++;
  }
  finishDraft();
}
function draftPick(id){
  const d=G.draft;if(!d)return;
  if(d.order[d.pick]!==G.user)return;
  const i=d.pool.findIndex(p=>p.id===id);if(i<0)return;
  const p=d.pool.splice(i,1)[0];const rnd=draftRoundNo();
  G.clubs[G.user].squad.push(p);d.log.push({club:G.user,id:p.id,round:rnd});
  pushNews('🎓',`ドラフト${rnd}巡: ${p.name}（${POS[p.pos].short}・OVR${overall(p)}／POT${p.potential}）を指名。`);
  d.pick++;advanceDraft();
}
function finishDraft(){
  const d=G.draft;G.draft=null;
  if(d)pushNews('✅',`ドラフト終了。${d.log.length}名の新人が各クラブに加入。`);
  newSeason();
}
function renderDraft(){
  const d=G.draft;
  if(!d)return '<div class="card"><div class="card-b center muted" style="padding:28px">ドラフトは終了しました。</div></div>';
  const onClock=d.order[d.pick];
  const yourTurn=(onClock===G.user)&&d.pick<d.order.length;
  const upcoming=d.order.slice(d.pick,d.pick+8).map((idx,i)=>`<span class="pill ${idx===G.user?'win':''}" style="margin:2px 3px">${i===0?'▶ ':''}${G.clubs[idx].name}</span>`).join(' ');
  const pool=d.pool.slice().sort((a,b)=>b.potential-a.potential);
  const rows=pool.map(p=>`<tr>
    <td><span class="ovr ${ovrTier(overall(p))}">${overall(p)}</span></td>
    <td><div style="display:flex;align-items:center;gap:8px"><span class="ava">${avatarSVG(p,32,null)}</span><div><div class="player-name">${p.name}</div><div class="tiny muted">${POS[p.pos].name} ・ ${flag(p.nat)} ${p.nat} ・ ${p.age}歳</div></div></div></td>
    <td class="center"><span class="pos ${p.pos}">${POS[p.pos].short}</span></td>
    <td class="center gold">${p.potential}</td>
    <td class="num">${yourTurn?`<button class="btn sm gold" data-draft="${p.id}">指名</button>`:''}</td>
  </tr>`).join("");
  const log=d.log.slice(-14).reverse().map(l=>{const p=findPlayerById(l.id);return `<div class="tiny" style="padding:3px 0;border-bottom:1px solid var(--line)">${l.round}巡 ・ <b>${G.clubs[l.club].name}</b> ← ${p?p.name:'?'}（${p?POS[p.pos].short:''}${p?'/OVR'+overall(p):''}）</div>`;}).join("");
  return `<p class="eyebrow">新人ドラフト ・ シーズン${G.seasonNo}終了後（全${d.rounds}巡 ・ スネーク方式）</p>
  <div class="card" style="margin-bottom:14px;border-color:${yourTurn?'var(--gold)':'var(--line2)'}"><div class="card-b">
    <div class="eyebrow">指名 ${Math.min(d.pick+1,d.order.length)} / ${d.order.length}（${draftRoundNo()}巡目）</div>
    <div style="margin:8px 0">${upcoming||'<span class="tiny muted">—</span>'}</div>
    ${yourTurn?`<div class="gold" style="font-weight:800">⏰ あなたの指名です。下のリストから選択してください。</div>`:`<div class="muted">${onClock!=null?G.clubs[onClock].name+' が選択中…':'ドラフト終了'}</div>`}
  </div></div>
  <div class="grid cols-2">
    <div class="card"><div class="card-h"><h3>指名可能なプロスペクト</h3><span class="tiny muted">${pool.length}名</span></div>
      <div class="card-b" style="padding:0"><table><thead><tr><th>OVR</th><th>選手</th><th class="center">位置</th><th class="center">POT</th><th></th></tr></thead><tbody>${rows}</tbody></table></div></div>
    <div class="card"><div class="card-h"><h3>指名履歴</h3></div><div class="card-b">${log||'<span class="tiny muted">まだありません</span>'}</div></div>
  </div>`;
}

============================================================ */
function renderMatch(){
  const m=G.match;const home=G.clubs[m.home],away=G.clubs[m.away];
  app().innerHTML=`
  <div class="topbar"><div class="topbar-in">
    <div class="crest">${crestSVG(G.user,42)}</div>
    <div class="club-meta"><span class="club-name">試合中継</span><span class="club-sub">第 ${G.round+1} 節</span></div>
    <div class="topbar-spacer"></div>
    <div class="stat-chip"><span class="k">${m.isHome?'ホーム':'アウェイ'}</span><span class="v gold">${m.isHome?G.clubs[m.home].name.slice(0,4):G.clubs[m.away].name.slice(0,4)}…</span></div>
  </div></div>
  <div class="wrap" style="padding-top:18px;max-width:760px">
    <div class="scoreboard">
      <div class="sb-team"><div class="crest" style="margin:0 auto 6px">${crestSVG(home.idx,40)}</div><div class="nm">${home.name}</div></div>
      <div class="sb-score" id="hs">0</div>
      <div class="sb-mid"><div class="sb-clock" id="clock">00'</div><div class="cz tiny" style="color:var(--gold);margin-top:4px">QUIDDITCH</div></div>
      <div class="sb-score" id="as">0</div>
      <div class="sb-team"><div class="crest" style="margin:0 auto 6px">${crestSVG(away.idx,40)}</div><div class="nm">${away.name}</div></div>
    </div>
    <div class="btn-row" style="justify-content:center;margin-top:14px">
      <button class="btn gold" id="pp">▶ 再生</button>
      <button class="btn" id="skip">⏭ 最後まで</button>
    </div>
    <div class="commentary" id="feed"></div>
    <div id="postmatch"></div>
  </div>`;
  // playback init
  const feed=document.getElementById("feed");
  const hsEl=document.getElementById("hs"),asEl=document.getElementById("as"),clockEl=document.getElementById("clock");
  const pp=document.getElementById("pp"),skip=document.getElementById("skip");

  function showEvent(e){
    hsEl.textContent=e.hs;asEl.textContent=e.as;
    clockEl.textContent=String(e.min)+"'";
    if(e.type==="catch"){hsEl.style.color=e.hs>e.as?"var(--gold)":"";asEl.style.color=e.as>e.hs?"var(--gold)":"";}
    const cls=e.type==="goal"?"goal":e.type==="snitch"?"snitch":e.type==="catch"?"catch":e.type==="beat"?"beat":"";
    const node=h(`<div class="cm ${cls}"><span class="min">${e.min}'</span><span class="txt">${e.txt}</span></div>`);
    feed.appendChild(node);
    feed.scrollTop=feed.scrollHeight;
  }
  function finish(){
    pp.disabled=true;skip.disabled=true;pp.textContent="試合終了";
    const m2=G.match;const win=(m2.isHome&&m2.hs>m2.as)||(!m2.isHome&&m2.as>m2.hs);const draw=m2.hs===m2.as;
    document.getElementById("postmatch").innerHTML=`
      <div class="card" style="margin-top:16px;text-align:center;border-color:${win?'var(--aqua)':draw?'var(--line2)':'#5a3631'}">
        <div class="card-b">
          <div class="cz" style="font-size:18px;color:${win?'var(--aqua)':draw?'var(--muted)':'var(--quaffle)'}">${win?'勝利！':draw?'引き分け':'敗戦'}</div>
          <div style="font-size:24px;font-weight:800;margin:6px 0">${G.clubs[m2.home].name} ${m2.hs} - ${m2.as} ${G.clubs[m2.away].name}</div>
          <button class="btn gold" id="fin" style="margin-top:8px">結果を確定して次へ ▶</button>
        </div>
      </div>`;
    document.getElementById("fin").onclick=()=>{if(G.match&&G.match.kind==='playoff')finalizePlayoffGame();else finalizeRound();};
  }
  function step(){
    if(m.idx>=m.ev.length){stop();finish();return;}
    showEvent(m.ev[m.idx]);m.idx++;
    if(m.idx>=m.ev.length){stop();finish();}
  }
  function play(){m.playing=true;pp.textContent="⏸ 一時停止";m.timer=setInterval(step,m.speed);}
  function stop(){m.playing=false;pp.textContent="▶ 再生";if(m.timer){clearInterval(m.timer);m.timer=null;}}
  pp.onclick=()=>{if(m.playing)stop();else play();};
  skip.onclick=()=>{stop();while(m.idx<m.ev.length){showEvent(m.ev[m.idx]);m.idx++;}finish();};
  // show kickoff immediately
  if(m.idx===0)step();
}

/* ============================================================
   ACTION BINDING (event delegation on document)
============================================================ */
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-view],[data-train],[data-style],[data-formation],[data-tempo],[data-press],[data-beater],[data-seeker],[data-sign],[data-release],[data-detail],[data-rankcat],[data-rankpos],[data-rankmetric],[data-loadslot],[data-delslot],[data-delok],[data-tpartner],[data-tgive],[data-tget],[data-tcash],[data-acceptoffer],[data-declineoffer],[data-fxfilter],[data-draft],#play,#poPlay,#autoLu,#scout,#nextSeason,#toDraft,#closeDetail,#saveFile,#loadBtn,#quickSave,#quickLoad,#continueSave,#openSlots,#slotsClose,#slotsBackdrop,#slotSaveNew,#delCancel,#sendTrade");
  if(!t)return;
  if(t.dataset.tpartner){G.trade.partner=+t.dataset.tpartner;G.trade.get=[];render();return;}
  if(t.dataset.tgive){const id=+t.dataset.tgive;G.trade.give=G.trade.give.includes(id)?G.trade.give.filter(x=>x!==id):[...G.trade.give,id];render();return;}
  if(t.dataset.tget){const id=+t.dataset.tget;G.trade.get=G.trade.get.includes(id)?G.trade.get.filter(x=>x!==id):[...G.trade.get,id];render();return;}
  if(t.dataset.tcash){const v=t.dataset.tcash;if(v==="reset")G.trade.cash=0;else G.trade.cash=clamp(G.trade.cash+(+v),0,G.budget);render();return;}
  if(t.id==="sendTrade"){sendTradeOffer();return;}
  if(t.dataset.acceptoffer){acceptOffer(t.dataset.acceptoffer);return;}
  if(t.dataset.declineoffer){declineOffer(t.dataset.declineoffer);return;}
  if(t.dataset.fxfilter){G.fxFilter=t.dataset.fxfilter;render();return;}
  if(t.id==="openSlots"){openSlots();return;}
  if(t.id==="slotsClose"||t.id==="slotsBackdrop"){closeSlots();return;}
  if(t.id==="slotSaveNew"){const el=document.getElementById("slotName");saveNewSlot(el?el.value:"");return;}
  if(t.id==="delCancel"){_delArm=null;openSlots();return;}
  if(t.dataset.loadslot){loadSlot(t.dataset.loadslot);return;}
  if(t.dataset.delslot){_delArm=t.dataset.delslot;openSlots();return;}
  if(t.dataset.delok){deleteSlot(t.dataset.delok);return;}
  if(t.id==="saveFile"){exportSave();return;}
  if(t.id==="loadBtn"){const fi=document.getElementById("loadInput");if(fi)fi.click();return;}
  if(t.id==="quickSave"){quickSave();return;}
  if(t.id==="quickLoad"){quickLoad();return;}
  if(t.id==="continueSave"){quickLoad();return;}
  if(t.dataset.rankcat){G.rankCat=t.dataset.rankcat;render();return;}
  if(t.dataset.rankpos){G.rankPos=t.dataset.rankpos;render();return;}
  if(t.dataset.rankmetric){G.rankMetric=t.dataset.rankmetric;render();return;}
  if(t.id==="play"){startUserMatch();return;}
  if(t.id==="poPlay"){startPlayoffMatch();return;}
  if(t.id==="autoLu"){autoLineup(G.clubs[G.user]);render();return;}
  if(t.id==="scout"){scoutMore();return;}
  if(t.id==="nextSeason"){newSeason();return;}
  if(t.id==="toDraft"){startDraft();return;}
  if(t.dataset.draft){draftPick(+t.dataset.draft);return;}
  if(t.id==="closeDetail"){_detailId=null;render();return;}
  if(t.dataset.view){G.view=t.dataset.view;_detailId=null;render();return;}
  if(t.dataset.train){G.training=t.dataset.train;render();return;}
  if(t.dataset.style){G.clubs[G.user].tactic.style=t.dataset.style;render();return;}
  if(t.dataset.formation){G.clubs[G.user].tactic.formation=t.dataset.formation;render();return;}
  if(t.dataset.tempo){G.clubs[G.user].tactic.tempo=t.dataset.tempo;render();return;}
  if(t.dataset.press){G.clubs[G.user].tactic.press=t.dataset.press;render();return;}
  if(t.dataset.beater){G.clubs[G.user].tactic.beater=t.dataset.beater;render();return;}
  if(t.dataset.seeker){G.clubs[G.user].tactic.seeker=t.dataset.seeker;render();return;}
  if(t.dataset.sign){signPlayer(+t.dataset.sign);return;}
  if(t.dataset.release){releasePlayer(+t.dataset.release);return;}
  if(t.dataset.detail){_detailId=+t.dataset.detail;render();return;}
});
document.addEventListener("change",e=>{
  const fi=e.target.closest("#loadInput");
  if(fi){importSaveFile(fi);return;}
  const s=e.target.closest("select[data-pos]");
  if(!s)return;
  const pos=s.dataset.pos,slot=+s.dataset.slot,val=s.value?+s.value:null;
  const lu=G.lineup;
  // remove val from anywhere it currently is
  if(val!=null)for(const k of POS_ORDER)lu[k]=lu[k].map(x=>x===val?"__":x);
  // set slot
  const arr=lu[pos].slice();while(arr.length<POS[pos].count)arr.push("__");
  arr[slot]=val!=null?val:"__";
  lu[pos]=arr;
  // clean placeholders -> keep array length but filter for validity handled at use
  for(const k of POS_ORDER)lu[k]=lu[k].filter(x=>x!=="__"&&x!=null);
  render();
});

  app().innerHTML=`
  <div class="intro">
    <div class="crest" style="width:64px;height:70px;margin:0 auto">${crestSVG(introSel,64)}</div>
    <h1>クィディッチ・マネージャー</h1>
    <p class="tag">一人の監督として、クラブを率いてリーグ制覇を目指せ。</p>
    <label class="fld" style="text-align:left;max-width:320px;margin:0 auto 18px">
      <span class="l">監督名</span>
      <input type="text" id="mgr" placeholder="あなたの名前" maxlength="16">
    </label>
    <div class="eyebrow" style="text-align:left;max-width:520px;margin:0 auto 8px">率いるクラブを選択</div>
    <div class="club-pick" id="picker">
      ${TEAMS.map((c,i)=>`<button class="club-card ${i===introSel?'sel':''}" data-club="${i}">
        <div class="crest" style="width:30px;height:33px">${crestSVG(i,30)}</div>
        <div><div class="cn">${c.name}</div><div class="cr">戦力 ${c.str>=72?'★★★':c.str>=64?'★★':'★'}</div></div>
      </button>`).join("")}
    </div>
    <button class="btn gold" id="start" style="width:100%;max-width:520px;padding:14px;font-size:16px">シーズンを始める ▶</button>
    ${hasSave()?`<button class="btn" id="continueSave" style="width:100%;max-width:520px;padding:12px;font-size:15px;margin-top:10px">▶ 続きから（前回のセーブ）</button>`:""}
    <button class="btn ghost" id="openSlots" style="width:100%;max-width:520px;padding:11px;font-size:14px;margin-top:10px">📂 セーブ一覧から読込</button>
    <p class="kbd" style="margin-top:14px">クラブ・選手はすべて架空です。クィディッチの競技ルールのみを再現しています。</p>
  </div>`;
  document.querySelectorAll("[data-club]").forEach(b=>b.onclick=()=>{introSel=+b.dataset.club;renderIntro();});
  document.getElementById("start").onclick=()=>{
    const name=document.getElementById("mgr").value.trim()||"あなた";
    newGame(introSel,name);render();
  };
  const cont=document.getElementById("continueSave");if(cont)cont.onclick=()=>quickLoad();
  const mgr=document.getElementById("mgr");if(mgr)mgr.focus();
}

/* ambient golden motes (built once, outside #app so re-renders don't clear it) */
function buildAmbient(){
  if(document.getElementById("ambient"))return;
  const a=document.createElement("div");a.id="ambient";
  let html="";
  for(let i=0;i<24;i++){
    const left=Math.random()*100, size=1.5+Math.random()*2.6, dur=14+Math.random()*16, delay=-Math.random()*30;
    html+=`<i style="left:${left.toFixed(1)}%;width:${size.toFixed(1)}px;height:${size.toFixed(1)}px;animation-duration:${dur.toFixed(1)}s;animation-delay:${delay.toFixed(1)}s"></i>`;
  }
  a.innerHTML=html;
  document.body.insertBefore(a,document.body.firstChild);
}

/* boot */
buildAmbient();
renderIntro();
